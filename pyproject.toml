[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wealth-os"
version = "0.1.0"
description = "Agent-driven personal operating system for wealth, deals, time, habits, and relationships"
requires-python = ">=3.10"
dependencies = [
  "openai-agents>=0.2.0",
  "python-dotenv>=1.0.0",
  "PyYAML>=6.0",
  "typer>=0.12.0",
  "rich>=13.0.0"
]

[project.scripts]
wealth-os = "wealth_os.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
