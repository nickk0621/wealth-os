[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wealth-os"
version = "0.3.0"
description = "Agent-driven personal operating system for wealth, deals, time, habits, relationships, and calendar intelligence"
requires-python = ">=3.10"
dependencies = [
  "openai-agents>=0.2.0",
  "python-dotenv>=1.0.0",
  "PyYAML>=6.0",
  "pydantic>=2.7.0",
  "typer>=0.12.0",
  "rich>=13.0.0",
  "streamlit>=1.37.0",
  "google-api-python-client>=2.140.0",
  "google-auth>=2.35.0",
  "google-auth-oauthlib>=1.2.1"
]

[project.scripts]
wealth-os = "wealth_os.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
